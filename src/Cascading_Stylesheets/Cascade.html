<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping</title>
    
    <link rel="stylesheet" href="Cascade.css">
    <link rel="stylesheet" href="Cascade2.css">


</head>
<body>

    <header>
        <h1>
            ShopEasy
            <button id="login">Login</button>
            <button id="signup">Sign Up</button>
        </h1>

        <div>
            <input type="text" placeholder="Search Products">
            <button id="search">Search</button>
        </div>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Mobiles</a></li>
                <li><a href="#">Fashion</a></li>
                <li><a href="#">Electronics</a></li>
                <li><a href="#">Cart</a></li>
            </ul>
        </nav>

        <hr>
    </header>

    <main>

        <div class="product">
            <h2>iPhone 16</h2>
            <p>Price: ₹79,999</p>
            <a class="details" href="#">View Details</a>
            <br><br>
            <button class="buy">Buy Now</button>
            <button>Add to Cart</button>
        </div>

        <hr>

        <div class="product">
            <h2>Samsung Galaxy S25</h2>
            <p>Price: ₹69,999</p>
            <a class="details" href="#">View Details</a>
            <br><br>
            <button class="buy">Buy Now</button>
            <button>Add to Cart</button>
        </div>

        <hr>

        <div class="product">
            <h2>HP Laptop</h2>
            <p>Price: ₹55,000</p>
            <a class="details" href="#">View Details</a>
            <br><br>
            <button class="buy">Buy Now</button>
            <button>Add to Cart</button>
        </div>

        <hr>

        <div class="product">
            <h2>Boat Headphones</h2>
            <p>Price: ₹2,499</p>
            <a class="details" href="#">View Details</a>
            <br><br>
            <button class="buy">Buy Now</button>
            <button>Add to Cart</button>
        </div>

    </main>

    <footer>
        <hr>
        <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

</body>
</html>
