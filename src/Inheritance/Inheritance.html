<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance Demo</title>
    <link rel="stylesheet" href="Inheritance.css">
</head>
<body>
    <body>
        <h1>Inheritance in CSS</h1>
        <p>This is a paragraph demonstrating inheritance.</p>
        <div>
            <h2>This is a heading inside a div.</h2>
            <form>
                <label>Username:</label>
                <input type="text" name="username">
                <label>Password:</label>
                <input type="password" name="password">
                <button type="Login">Login</button>
            </form>
            <hr/>
            </div>

            
        <div> 
            <h2>This is another heading inside a div.</h2>
            <p>This is another paragraph demonstrating inheritance.</p>
        </div>
        <hr/>
    
</body>
</html>
